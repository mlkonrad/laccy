[package]
name = "laccy-wayland"
description = "Laccy's clipboard watcher and paster for Wayland compositors other than GNOME"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
laccy-core.workspace = true
gio.workspace = true
rustix = { version = "1", features = ["pipe", "fs", "event"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
glib-unix = "0.22"
